name: Release pstack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two runs must not race to publish the same version.
concurrency:
  group: release-pstack
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance signs the package with this workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Decide
        id: decide
        # Run the script directly: `bun run` prints a header line that would corrupt GITHUB_OUTPUT.
        run: bun packages/pstack/src/release/build.ts --decide | tee -a "$GITHUB_OUTPUT"
      - name: Verify
        if: steps.decide.outputs.release == 'true'
        run: bun run verify
      - name: Build
        if: steps.decide.outputs.release == 'true'
        run: bun run build:release -- --out "$RUNNER_TEMP/pstack-release"
      - name: Publish to npm
        if: steps.decide.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP/pstack-release" --access public --provenance
