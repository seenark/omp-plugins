name: Release pstack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two runs must not race on the release/pstack branch.
concurrency:
  group: release-pstack
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the version/tag decision reads every pstack-v* tag, and release/pstack must be fetched to extend it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Decide
        id: decide
        # Run the script directly: `bun run` prints a header line that would corrupt GITHUB_OUTPUT.
        run: bun packages/pstack/src/release/build.ts --decide | tee -a "$GITHUB_OUTPUT"
      - name: Verify
        if: steps.decide.outputs.release == 'true'
        run: bun run verify
      - name: Build
        if: steps.decide.outputs.release == 'true'
        run: bun run build:release -- --out "$RUNNER_TEMP/pstack-release"
      - name: Publish to release/pstack
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$RUNNER_TEMP/release-branch"
          if git ls-remote --exit-code --heads origin release/pstack > /dev/null; then
            git worktree add -B release/pstack "$branch" origin/release/pstack
          else
            git worktree add --detach "$branch"
            git -C "$branch" checkout --orphan release/pstack
          fi
          rsync -a --delete --exclude=/.git "$RUNNER_TEMP/pstack-release/" "$branch/"
          git -C "$branch" add -A
          git -C "$branch" commit --allow-empty -m "pstack v$VERSION" -m "Built from $GITHUB_SHA."
          git -C "$branch" tag "$TAG"
          git -C "$branch" push --atomic origin release/pstack "refs/tags/$TAG"
