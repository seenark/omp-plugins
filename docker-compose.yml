services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.37.0
    command: ["--host", "0.0.0.0", "--port", "8787"]
    restart: unless-stopped
    environment:
      HEADROOM_HOST: "0.0.0.0"
      # Required when a tunnel or non-loopback client calls /v1/compress.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      # ONNX CPU path needs onnxruntime + transformers, not PyTorch.
      HEADROOM_KOMPRESS_BACKEND: "onnx_cpu"
      # Keep downloaded Kompress artifacts across container recreation.
      HOME: "/home/nonroot"
      HF_HOME: "/home/nonroot/.headroom/huggingface"
      HEADROOM_WORKSPACE_DIR: "/home/nonroot/.headroom"
      HEADROOM_CONFIG_DIR: "/home/nonroot/.headroom/config"
      # Empty is acceptable for loopback-only local testing.
      # Set HEADROOM_PROXY_TOKEN before exposing this port through a tunnel.
      HEADROOM_PROXY_TOKEN: "${HEADROOM_PROXY_TOKEN:-}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - headroom_workspace:/home/nonroot/.headroom
    healthcheck:
      # /readyz checks proxy serving state. Optional Kompress readiness is
      # checked separately through /debug/warmup and /health checks.kompress.
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  headroom_workspace:
